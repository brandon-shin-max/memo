<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나에게">
<title>나에게 보내기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232B54C8'/%3E%3Cpath d='M18 22h28a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H30l-8 6v-6h-4a4 4 0 0 1-4-4V26a4 4 0 0 1 4-4z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600&amp;display=swap">
<style>
:root {
  /* 한 열 보관 기록: 상단 바 · 날짜별로 쌓이는 대화 · 하단 입력창 (PC에서는 가운데 760px 열) */
  --paper: #ECEFF3;
  --card: #FFFFFF;
  --ink: #17202B;
  --muted: #667284;
  --accent: #2B54C8;
  --bubble: #DAE3FA;
  --line: #D3D9E1;
  --on-accent: #FFFFFF;
  --danger: #B93A2E;
  --shade: rgba(15, 21, 30, 0.45);
  --b-pdf: #B93A2E;
  --b-sheet: #1E7A4C;
  --b-doc: #2B54C8;
  --b-slide: #BB5A1D;
  --b-hwp: #16809A;
  --b-zip: #6A57A8;
  --b-media: #8C5896;
  --b-etc: #667284;
  --font-display: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1318;
    --card: #181D24;
    --ink: #E3E8EF;
    --muted: #8D97A5;
    --accent: #8EA8FF;
    --bubble: #233252;
    --line: #2B333E;
    --on-accent: #0F1318;
    --danger: #F0796C;
    --shade: rgba(0, 0, 0, 0.6);
    --b-pdf: #E3705F;
    --b-sheet: #4FB27F;
    --b-doc: #8EA8FF;
    --b-slide: #E8914F;
    --b-hwp: #52B7CF;
    --b-zip: #A895E4;
    --b-media: #C795D2;
    --b-etc: #8D97A5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1318;
  --card: #181D24;
  --ink: #E3E8EF;
  --muted: #8D97A5;
  --accent: #8EA8FF;
  --bubble: #233252;
  --line: #2B333E;
  --on-accent: #0F1318;
  --danger: #F0796C;
  --shade: rgba(0, 0, 0, 0.6);
  --b-pdf: #E3705F;
  --b-sheet: #4FB27F;
  --b-doc: #8EA8FF;
  --b-slide: #E8914F;
  --b-hwp: #52B7CF;
  --b-zip: #A895E4;
  --b-media: #C795D2;
  --b-etc: #8D97A5;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.app { height: 100%; display: flex; flex-direction: column; }
.wrap {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
}

/* 로그인 */
.auth { height: 100%; overflow-y: auto; display: grid; align-items: center; padding: max(24px, env(safe-area-inset-top)) 16px 24px; }
.auth-card { width: min(400px, 100%); margin: 0 auto; display: grid; gap: 10px; padding: 26px 22px 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
.auth-card h1 { margin: 0 0 2px; font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; }
.auth-sub { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.auth-card label { margin-top: 4px; font-size: 13px; font-weight: 600; }
.auth-card input { height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--paper); font-size: 16px; }
.auth-card input:focus { outline: none; border-color: var(--accent); }
.auth-err { margin: 2px 0 0; font-size: 13.5px; color: var(--danger); }
.auth-card .btn { height: 46px; margin-top: 8px; font-size: 15px; }

/* 상단 바 */
.bar { flex: none; position: relative; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.bar-row { display: flex; align-items: center; gap: 12px; min-height: 58px; }
.title-wrap { flex: 1; min-width: 0; display: grid; gap: 2px; }
.title { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.25; letter-spacing: -0.01em; }
.sub { margin: 0; display: flex; align-items: center; gap: 8px; min-height: 18px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { flex: none; width: 56px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.meter span { display: block; width: 0; height: 100%; border-radius: 2px; background: var(--accent); }
.bar-actions { display: flex; gap: 2px; margin-right: -8px; }
.icon-btn { flex: none; width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); display: grid; place-items: center; }
.icon-btn:hover { background: var(--paper); }
.icon-btn svg { width: 22px; height: 22px; }
.searchbar { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; }
.searchbar input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font-size: 16px; }
.searchbar input:focus { outline: none; border-color: var(--accent); }
.search-count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.text-btn { border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 14px; padding: 8px 4px; white-space: nowrap; }

.banner { flex: none; background: var(--card); border-bottom: 1px solid var(--line); }
.banner .wrap { display: flex; align-items: center; gap: 12px; padding-top: 9px; padding-bottom: 9px; }
.banner p { flex: 1; margin: 0; font-size: 13.5px; color: var(--danger); }

/* 대화 영역 */
.main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.scroller { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; overflow-anchor: none; }
.thread { min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding-top: 8px; padding-bottom: 14px; }
.list { display: flex; flex-direction: column; }
.more { align-self: center; margin: 10px 0 4px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600; }

.day { display: flex; align-items: baseline; gap: 8px; padding: 22px 0 8px; }
.day::after { content: ""; flex: 1; height: 1px; align-self: center; background: var(--line); }
.list > .day:first-child { padding-top: 10px; }
.day-date { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.day-week { font-size: 12.5px; color: var(--muted); }

.row { display: flex; justify-content: flex-end; align-items: flex-end; gap: 6px; padding-top: 3px; }
.row.gap { padding-top: 10px; }
.day + .row { padding-top: 4px; }
.meta { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; padding-bottom: 3px; font-size: 11.5px; line-height: 1.3; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.meta .time { display: none; }
.row.show-time .meta .time { display: block; }
.meta .state.fail { color: var(--danger); font-weight: 600; }
.stack { min-width: 0; max-width: min(80%, 540px); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.bubble {
  max-width: 100%;
  padding: 8px 13px;
  border-radius: 17px 17px 5px 17px;
  background: var(--bubble);
  color: var(--ink);
  font-size: 15.5px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
  user-select: text;
  -webkit-user-select: text;
}
.bubble.dim { opacity: 0.6; }
.bubble a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.row.sel .bubble, .row.sel .card { box-shadow: 0 0 0 2px var(--accent); }

.media { position: relative; display: block; width: min(260px, 62vw); max-height: 340px; aspect-ratio: 4 / 3; margin: 0; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: var(--line); cursor: zoom-in; }
.media img, .media video { display: block; width: 100%; height: 100%; object-fit: cover; }
.media.vid { aspect-ratio: 16 / 9; background: #0B0E12; cursor: pointer; }
.media.vid video { object-fit: contain; }
.play { position: absolute; inset: 0; width: 46px; height: 46px; margin: auto; border-radius: 50%; background: rgba(10, 14, 20, 0.62); color: #FFFFFF; display: grid; place-items: center; pointer-events: none; }
.play svg { width: 22px; height: 22px; margin-left: 3px; }
.broken-note { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; text-align: center; font-size: 12.5px; color: var(--muted); }

.card { width: min(300px, 72vw); display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px 12px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.badge {
  flex: none;
  width: 40px;
  height: 48px;
  padding-top: 6px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  clip-path: polygon(0 0, 70% 0, 100% 22%, 100% 100%, 0 100%);
  background: var(--b-etc);
  color: var(--card);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.03em;
}
.badge[data-g="pdf"] { background: var(--b-pdf); }
.badge[data-g="sheet"] { background: var(--b-sheet); }
.badge[data-g="doc"] { background: var(--b-doc); }
.badge[data-g="slide"] { background: var(--b-slide); }
.badge[data-g="hwp"] { background: var(--b-hwp); }
.badge[data-g="zip"] { background: var(--b-zip); }
.badge[data-g="media"] { background: var(--b-media); }
.badge.small { width: 30px; height: 36px; padding-top: 4px; font-size: 9px; }
.finfo { min-width: 0; }
.fname { font-size: 14.5px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; word-break: break-word; }
.fmeta { margin-top: 2px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fmeta.err { color: var(--danger); }
.card-btns { grid-column: 1 / -1; display: flex; gap: 6px; }
.card-btn { flex: 1; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--ink); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.card-btn.primary { color: var(--accent); }
.card-btn:hover { border-color: var(--accent); }
.progress { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.progress span { display: block; width: 0; height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.25s ease; }
.progress.indeterminate span { width: 32%; animation: slide 1.2s ease-in-out infinite; }
.progress.idle span { width: 0; animation: none; }
@keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(320%); } }

.actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.chip { height: 32px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 13px; font-weight: 600; }
.chip.danger { color: var(--danger); }

.empty { max-width: 480px; display: grid; gap: 12px; padding: 24px 0 12px; }
.empty h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.35; letter-spacing: -0.01em; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); font-size: 14px; }
.empty ol { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: step; }
.empty li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14.5px; }
.empty li::before {
  counter-increment: step;
  content: counter(step);
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--card);
  color: var(--accent);
  font-size: 12.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.no-result { padding: 32px 0; color: var(--muted); font-size: 14px; }
.loading-note { padding: 32px 0; color: var(--muted); font-size: 14px; }

.jump { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: 12px; height: 36px; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--accent); font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); }
.jump svg { width: 18px; height: 18px; }

/* 입력창 */
.composer { flex: none; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.composer .wrap { display: grid; gap: 8px; padding-top: 10px; padding-bottom: 10px; }
.tray { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.tchip { flex: none; max-width: 230px; display: flex; align-items: center; gap: 8px; padding: 6px 4px 6px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.tchip img { flex: none; width: 36px; height: 36px; border-radius: 7px; object-fit: cover; }
.tchip-text { min-width: 0; }
.tchip-name { font-size: 12.5px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.tchip-size { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tchip .icon-btn { width: 30px; height: 30px; }
.tchip .icon-btn svg { width: 16px; height: 16px; }
.crow { display: flex; align-items: flex-end; gap: 8px; }
.round { flex: none; width: 42px; height: 42px; border: 0; border-radius: 50%; display: grid; place-items: center; }
.round svg { width: 22px; height: 22px; }
.attach { background: var(--paper); color: var(--ink); }
.send { background: var(--accent); color: var(--on-accent); }
.send:disabled { opacity: 0.35; }
#input { flex: 1; min-width: 0; height: 42px; min-height: 42px; max-height: 148px; padding: 9px 15px; border: 1px solid var(--line); border-radius: 21px; background: var(--paper); font-size: 16px; line-height: 1.45; resize: none; overflow-y: auto; }
#input:focus { outline: none; border-color: var(--accent); }

/* 알림 · 대화상자 */
.toast { position: fixed; left: 50%; bottom: 84px; z-index: 90; max-width: min(92vw, 480px); transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--card); font-size: 14px; text-align: center; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2); }
.overlay { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: var(--shade); }
.dialog { width: min(380px, 100%); display: grid; gap: 10px; padding: 20px; border-radius: 16px; background: var(--card); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2); }
.dialog h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.4; }
.dialog-body { color: var(--muted); font-size: 14px; }
.dialog-body ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink); }
.dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.btn { height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn.primary { border-color: transparent; background: var(--accent); color: var(--on-accent); }
.btn.danger { border-color: transparent; background: var(--danger); color: #FFFFFF; }
.btn:disabled { opacity: 0.6; }

.menu-backdrop { position: fixed; inset: 0; z-index: 39; }
.menu { position: fixed; z-index: 40; top: calc(env(safe-area-inset-top) + 54px); right: max(12px, calc((100vw - 760px) / 2 + 8px)); width: min(300px, calc(100vw - 24px)); display: grid; gap: 2px; padding: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16); }
.storage { display: grid; gap: 6px; margin-bottom: 4px; padding: 10px 12px 12px; border-bottom: 1px solid var(--line); }
.ms-label { font-size: 12px; color: var(--muted); }
.ms-big { font-family: var(--font-display); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.ms-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.ms-bar span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.ms-note { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.item { padding: 10px 12px; border: 0; border-radius: 9px; background: transparent; font-size: 14.5px; text-align: left; }
.item:hover { background: var(--paper); }
.item.danger { color: var(--danger); }

/* 모아보기 */
.drawer { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: flex-end; background: var(--shade); }
.drawer-panel { width: min(440px, 100%); height: 100%; display: flex; flex-direction: column; background: var(--paper); padding-top: env(safe-area-inset-top); }
.drawer-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 0 16px; background: var(--card); }
.drawer-head h2 { flex: 1; margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.tabs { display: flex; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--card); }
.tab { flex: 1; padding: 12px 6px 10px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.drawer-body { flex: 1; overflow-y: auto; padding: 4px 16px calc(20px + env(safe-area-inset-bottom)); }
.month { margin: 16px 0 8px; font-family: var(--font-display); font-weight: 600; font-size: 13.5px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.tile { position: relative; aspect-ratio: 1; padding: 0; border: 0; border-radius: 6px; overflow: hidden; background: var(--line); }
.tile img, .tile video { display: block; width: 100%; height: 100%; object-fit: cover; }
.tile .play { width: 34px; height: 34px; }
.tile .play svg { width: 16px; height: 16px; margin-left: 2px; }
.flist { display: grid; gap: 8px; }
.frow { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.frow .card-btns { grid-column: 1 / -1; }
.lrow { display: grid; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.lrow a { color: var(--accent); font-size: 14px; overflow-wrap: anywhere; word-break: break-all; }
.lrow span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.drawer-empty { margin: 32px 0; color: var(--muted); font-size: 14px; }
.drawer-note { margin: 14px 0 0; color: var(--muted); font-size: 12.5px; }

/* 크게 보기 */
.viewer { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; background: rgba(8, 10, 14, 0.94); color: #FFFFFF; }
.viewer-head { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 10px 8px 16px; }
.vname { flex: 1; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
.vbtn { height: 36px; padding: 0 14px; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 9px; background: rgba(255, 255, 255, 0.08); color: #FFFFFF; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.vbtn.icon { width: 36px; padding: 0; display: grid; place-items: center; }

let toastTimer = 0;
function toast(msg, opts = {}) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.bottom = ((composerEl.offsetHeight || 60) + 12) + 'px';
  t.hidden = false;
  clearTimeout(toastTimer);
  if (!opts.sticky) toastTimer = setTimeout(() => { t.hidden = true; }, opts.ms || 2800);
  return { update(m) { t.textContent = m; }, close() { if (opts.sticky || t.textContent === msg) t.hidden = true; } };
}
function dialog({ title, body, ok = '확인', cancel = '취소', danger = false, okOnly = false }) {
  return new Promise((resolve) => {
    const ov = $('#dialog'), okB = $('#dlgOk'), noB = $('#dlgCancel'), bodyEl = $('#dlgBody');
    $('#dlgTitle').textContent = title;
    bodyEl.textContent = '';
    if (body instanceof Node) bodyEl.append(body); else bodyEl.textContent = body || '';
    okB.textContent = ok;
    okB.className = 'btn ' + (danger ? 'danger' : 'primary');
    noB.textContent = cancel;
    noB.hidden = okOnly;
    const prev = document.activeElement;
    const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); } };
    function done(v) {
      ov.hidden = true;
      okB.onclick = noB.onclick = ov.onclick = null;
      document.removeEventListener('keydown', onKey, true);
      if (prev && prev.focus) { try { prev.focus({ preventScroll: true }); } catch (_) { /* 무시 */ } }
      resolve(v);
    }
    okB.onclick = () => done(true);
    noB.onclick = () => done(false);
    ov.onclick = (e) => { if (e.target === ov) done(false); };
    document.addEventListener('keydown', onKey, true);
    ov.hidden = false;
    (okOnly ? okB : noB).focus();
  });
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('복사했어요'); return; } catch (_) { /* 아래 방법으로 */ }
  const ta = el('textarea');
  ta.value = text; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.append(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
  ta.remove();
  toast(ok ? '복사했어요' : '복사가 막혀 있어요. 글을 길게 눌러 직접 복사해 주세요.');
}

/* ---------- Supabase 통신 ---------- */
async function httpError(r) {
  let j = {};
  try { j = await r.json(); } catch (_) { j = {}; }
  return { code: 'http', status: r.status, msg: String(j.message || j.msg || j.error_description || j.error || '') };
}
function readSession() {
  try { const s = JSON.parse(load(SESSION_KEY) || 'null'); return s && s.access_token && s.refresh_token ? s : null; } catch (_) { return null; }
}
function setSession(j) {
  const now = Math.floor(Date.now() / 1000);
  const prev = S.session || {};
  S.session = {
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expires_at: Number(j.expires_at) || now + (Number(j.expires_in) || 3600),
    user_id: (j.user && j.user.id) || prev.user_id,
    email: (j.user && j.user.email) || prev.email || ''
  };
  store(SESSION_KEY, JSON.stringify(S.session));
}
let refreshing = null;
function refreshSession() {
  if (!refreshing) {
    refreshing = (async () => {
      const s = S.session;
      if (!s || !s.refresh_token) throw { code: 'signed_out' };
      let r;
      try {
        r = await fetch(S.url + '/auth/v1/token?grant_type=refresh_token', {
          method: 'POST', headers: { apikey: S.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token })
        });
      } catch (_) { throw { code: 'network' }; }
      if (r.status === 400 || r.status === 401 || r.status === 403) {
        const other = readSession();
        if (other && other.refresh_token !== s.refresh_token) { S.session = other; return; }
        signOutLocal();
        throw { code: 'signed_out' };
      }
      if (!r.ok) throw await httpError(r);
      setSession(await r.json());
    })().finally(() => { refreshing = null; });
  }
  return refreshing;
}
async function accessToken() {
  if (!S.session) throw { code: 'signed_out' };
  if (S.session.expires_at * 1000 - 60000 > Date.now()) return S.session.access_token;
  await refreshSession();
  return S.session.access_token;
}
async function api(path, opts = {}, retried = false) {
  const t = await accessToken();
  let r;
  try {
    r = await fetch(S.url + path, {
      method: opts.method || 'GET',
      headers: Object.assign({ apikey: S.key, Authorization: 'Bearer ' + t }, opts.headers || {}),
      body: opts.body
    });
  } catch (_) { throw { code: 'network' }; }
  if (r.status === 401 && !retried) { await refreshSession(); return api(path, opts, true); }
  if (!r.ok) throw await httpError(r);
  return r;
}
const getJSON = async (path) => (await api(path)).json();
function xhr(method, path, { body = null, headers = {}, responseType = '', onProgress = null, job = null } = {}, retried = false) {
  return accessToken().then((t) => new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open(method, S.url + path);
    x.setRequestHeader('apikey', S.key);
    x.setRequestHeader('Authorization', 'Bearer ' + t);
    for (const k of Object.keys(headers)) x.setRequestHeader(k, headers[k]);
    if (responseType) x.responseType = responseType;
    const prog = (e) => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    if (method === 'GET') x.onprogress = prog; else if (x.upload) x.upload.onprogress = prog;
    x.onload = async () => {
      if (x.status >= 200 && x.status < 300) { resolve(x.response); return; }
      if (x.status === 401 && !retried) {
        try { await refreshSession(); resolve(await xhr(method, path, { body, headers, responseType, onProgress, job }, true)); } catch (e) { reject(e); }
        return;
      }
      let msg = '';
      try { const txt = x.responseType === 'blob' ? await x.response.text() : x.responseText; const j = JSON.parse(txt); msg = String(j.message || j.error || ''); } catch (_) { msg = ''; }
      reject({ code: 'http', status: x.status, msg });
    };
    x.onerror = () => reject({ code: 'network' });
    x.onabort = () => reject(CANCEL);
    if (job) job.xhr = x;
    x.send(body);
  }));
}
function uploadObject(path, blob, type, onProgress, job) {
  return xhr('POST', '/storage/v1/object/' + BUCKET + '/' + encPath(path), {
    body: blob, headers: { 'Content-Type': type || 'application/octet-stream', 'x-upsert': 'false' }, onProgress, job
  });
}
function getObject(path, onProgress) {
  return xhr('GET', '/storage/v1/object/authenticated/' + BUCKET + '/' + encPath(path), { responseType: 'blob', onProgress });
}
async function removeObjects(paths) {
  const list = paths.filter(safePath);
  for (let i = 0; i < list.length; i += 500) {
    await api('/storage/v1/object/' + BUCKET, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prefixes: list.slice(i, i + 500) }) });
  }
}
const signed = new Map();
async function signPaths(paths) {
  const now = Date.now();
  const need = [...new Set(paths)].filter((p) => { const s = signed.get(p); return !s || s.exp < now + 120000; });
  if (need.length) {
    const r = await api('/storage/v1/object/sign/' + BUCKET, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ expiresIn: SIGN_TTL, paths: need }) });
    const arr = await r.json();
    for (const it of Array.isArray(arr) ? arr : []) {
      if (it && it.signedURL && it.path) signed.set(it.path, { url: encodeURI(S.url + '/storage/v1' + it.signedURL), exp: now + SIGN_TTL * 1000 });
    }
  }
  return paths.map((p) => (signed.get(p) ? signed.get(p).url : null));
}
async function insertRow(row) {
  const r = await api('/rest/v1/messages', { method: 'POST', headers: { 'Content-Type': 'application/json', Prefer: 'return=representation' }, body: JSON.stringify(row) });
  const arr = await r.json();
  return Array.isArray(arr) ? arr[0] : arr;
}
async function softDelete(id) {
  const r = await api('/rest/v1/messages?id=eq.' + encodeURIComponent(id), {
    method: 'PATCH', headers: { 'Content-Type': 'application/json', Prefer: 'return=representation' }, body: JSON.stringify({ deleted: true, body: null, file: null })
  });
  const arr = await r.json();
  return Array.isArray(arr) ? arr[0] : arr;
}

/* ---------- 데이터 ---------- */
function cleanFile(f) {
  if (!f || typeof f !== 'object' || !safePath(f.p)) return null;
  const out = { n: typeof f.n === 'string' && f.n ? f.n : '파일', s: Number(f.s) || 0, m: typeof f.m === 'string' ? f.m : '', p: f.p };
  if (safePath(f.tp)) out.tp = f.tp;
  if (Number(f.w) > 0 && Number(f.h) > 0) { out.w = Number(f.w); out.h = Number(f.h); }
  return out;
}
function toMsg(row) {
  if (!row || typeof row.id !== 'string' || row.deleted) return null;
  const t = parseTs(row.sent_at);
  if (!Number.isFinite(t)) return null;
  const m = { id: row.id, t };
  if (typeof row.body === 'string' && row.body) m.text = row.body;
  const f = cleanFile(row.file);
  if (f) m.file = f;
  return m.text || m.file ? m : null;
}
function applyRows(rows, { moveCursor = true } = {}) {
  let changed = false;
  for (const row of Array.isArray(rows) ? rows : []) {
    if (!row || typeof row.id !== 'string') continue;
    const u = parseTs(row.updated_at);
    if (moveCursor && Number.isFinite(u) && u > S.cursor) S.cursor = u;
    const m = toMsg(row);
    if (S.pending.has(row.id)) { S.pending.delete(row.id); changed = true; }
    if (!m) { if (S.msgs.delete(row.id)) changed = true; continue; }
    const cur = S.msgs.get(row.id);
    if (!cur || cur.t !== m.t || cur.text !== m.text || JSON.stringify(cur.file) !== JSON.stringify(m.file)) { S.msgs.set(row.id, m); changed = true; }
  }
  if (changed) S.sorted = [...S.msgs.values()].sort(byTime);
  return changed;
}
function resetData() {
  S.msgs.clear(); S.sorted = []; S.cursor = 0; S.oldest = null; S.hasMore = false; S.loaded = false;
  S.pending.clear(); S.search = ''; S.searchRows = null; S.selected = null; S.usage = null; signed.clear();
  for (const k of [...nodes.keys()]) nodes.delete(k);
  listEl.textContent = '';
}
async function initialLoad() {
  const rows = await getJSON('/rest/v1/messages?select=' + COLS + '&deleted=is.false&order=sent_at.desc&limit=' + PAGE);
  S.msgs.clear();
  S.cursor = 0;
  applyRows(rows);
  S.sorted = [...S.msgs.values()].sort(byTime);
  S.hasMore = rows.length === PAGE;
  S.oldest = rows.length ? rows[rows.length - 1].sent_at : null;
  S.loaded = true;
  S.stick = true;
}
async function loadOlder() {
  if (!S.oldest || S.loadingOlder) return;
  S.loadingOlder = true;
  $('#btnMore').disabled = true;
  try {
    const rows = await getJSON('/rest/v1/messages?select=' + COLS + '&deleted=is.false&sent_at=lt.' + encodeURIComponent(S.oldest) + '&order=sent_at.desc&limit=' + PAGE);
    S.hasMore = rows.length === PAGE;
    if (rows.length) S.oldest = rows[rows.length - 1].sent_at;
    applyRows(rows, { moveCursor: false });
    S.prepend = true;
    render();
  } catch (e) { toast(errText(e)); }
  finally { S.loadingOlder = false; $('#btnMore').disabled = false; }
}
async function poll() {
  if (S.polling || !S.loaded || !S.session || document.hidden) return;
  S.polling = true;
  try {
    const since = new Date(Math.max(0, S.cursor - 3000)).toISOString();
    const rows = await getJSON('/rest/v1/messages?select=' + COLS + '&updated_at=gte.' + encodeURIComponent(since) + '&order=updated_at.asc&limit=500');
    if (applyRows(rows)) { render(); renderDrawer(); }
    if (S.status !== 'ok') setStatus('ok');
  } catch (e) {
    if (e && e.code === 'signed_out') { showLogin('로그인이 풀렸어요. 다시 로그인해 주세요.'); return; }
    setStatus('offline');
  } finally { S.polling = false; }
}
function startPolling() {
  clearInterval(S.pollTimer);
  S.pollTimer = setInterval(poll, POLL_MS);
}
function stopPolling() { clearInterval(S.pollTimer); S.pollTimer = 0; }

/* ---------- 화면 전환 ---------- */
function readConfig() {
  if (CONFIG.url && CONFIG.key) return { url: CONFIG.url, key: CONFIG.key };
  try { const c = JSON.parse(load(CONFIG_KEY) || 'null'); if (c && c.url && c.key) return c; } catch (_) { /* 없음 */ }
  return null;
}
function showAuth(mode, err) {
  S.mode = mode;
  $('#app').hidden = true;
  $('#auth').hidden = false;
  const setup = mode === 'setup';
  $('#authTitle').textContent = setup ? '처음 설정' : '나에게 보내기';
  $('#authSub').textContent = setup ? 'Supabase 프로젝트 주소와 공개 키를 넣어 주세요. 이 기기에만 저장돼요.' : '본인 계정으로 로그인해 주세요.';
  $('#loginFields').hidden = setup;
  $('#setupFields').hidden = !setup;
  $('#authBtn').textContent = setup ? '저장' : '로그인';
  $('#authBtn').disabled = false;
  const e = $('#authErr');
  e.hidden = !err;
  e.textContent = err || '';
  setTimeout(() => (setup ? $('#cfgUrl') : ($('#authEmail').value ? $('#authPw') : $('#authEmail'))).focus(), 50);
}
function showLogin(err) {
  stopPolling();
  closeOverlays();
  if (S.session) signOutLocal();
  showAuth('login', err);
}
function signOutLocal() { S.session = null; store(SESSION_KEY, null); stopPolling(); }
async function signOut() {
  closeMenu();
  const s = S.session;
  signOutLocal();
  resetData();
  showAuth('login');
  if (s) { try { await fetch(S.url + '/auth/v1/logout', { method: 'POST', headers: { apikey: S.key, Authorization: 'Bearer ' + s.access_token } }); } catch (_) { /* 무시 */ } }
}
async function onAuthSubmit(e) {
  e.preventDefault();
  const err = $('#authErr'), btn = $('#authBtn');
  err.hidden = true;
  if (S.mode === 'setup') {
    let url = $('#cfgUrl').value.trim().replace(/\/+$/, '');
    const key = $('#cfgKey').value.trim();
    if (!/^https:\/\/[A-Za-z0-9.-]+$/.test(url) || !key) { err.textContent = '주소는 https://로 시작해야 하고, 키도 넣어 주세요.'; err.hidden = false; return; }
    store(CONFIG_KEY, JSON.stringify({ url, key }));
    S.url = url; S.key = key;
    showAuth('login');
    return;
  }
  const email = $('#authEmail').value.trim(), pw = $('#authPw').value;
  if (!email || !pw) { err.textContent = '이메일과 비밀번호를 넣어 주세요.'; err.hidden = false; return; }
  btn.disabled = true;
  btn.textContent = '로그인 중…';
  try {
    let r;
    try {
      r = await fetch(S.url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: S.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pw }) });
    } catch (_) { throw { code: 'network' }; }
    if (!r.ok) {
      const he = await httpError(r);
      if (/not confirmed/i.test(he.msg)) throw { code: 'login', text: '이메일 인증이 안 된 계정이에요. Supabase에서 사용자를 만들 때 Auto Confirm을 켜 주세요.' };
      if (r.status === 400 || r.status === 401) throw { code: 'login', text: '이메일이나 비밀번호가 맞지 않아요.' };
      throw he;
    }
    setSession(await r.json());
    $('#authPw').value = '';
    startApp();
  } catch (x) {
    err.textContent = x && x.code === 'login' ? x.text : errText(x);
    err.hidden = false;
    btn.disabled = false;
    btn.textContent = '로그인';
  }
}

/* ---------- 연결 상태 ---------- */
function setStatus(st) {
  if (st === 'offline' && S.status !== 'offline') S.offlineSince = Date.now();
  S.status = st;
  renderBanner();
  renderSub();
}
function renderBanner() {
  let text = '';
  if (S.status === 'offline') {
    text = '서버에 연결하지 못했어요. 잠시 후 자동으로 다시 시도해요.';
    if (Date.now() - S.offlineSince > 60000) text = '계속 연결되지 않아요. Supabase 프로젝트가 일시정지되지 않았는지 확인해 주세요.';
  } else if (S.status === 'error') text = '대화를 불러오지 못했어요.';
  $('#banner').hidden = !text;
  $('#bannerText').textContent = text;
  $('#bannerBtn').hidden = !text;
}
function renderSub() {
  let txt;
  const u = S.usage;
  if (S.status === 'loading') txt = '불러오는 중…';
  else if (S.status === 'offline') txt = '연결 안 됨';
  else if (S.status === 'error') txt = '불러오기 실패';
  else if (u != null) txt = '저장공간 ' + fmtSize(u) + ' / ' + fmtSize(STORAGE_LIMIT);
  else txt = '폰·PC 동기화됨';
  $('#subText').textContent = txt;
  const show = S.status === 'ok' && u != null;
  $('#meter').hidden = !show;
  if (show) $('#meterFill').style.width = Math.min(100, (u / STORAGE_LIMIT) * 100).toFixed(1) + '%';
}

async function startApp() {
  $('#auth').hidden = true;
  $('#app').hidden = false;
  closeOverlays();
  resetData();
  $('#loadingNote').hidden = false;
  setStatus('loading');
  updateComposer();
  try {
    await initialLoad();
    setStatus('ok');
  } catch (e) {
    if (e && e.code === 'signed_out') { showLogin('로그인이 풀렸어요. 다시 로그인해 주세요.'); return; }
    setStatus(e && e.code === 'network' ? 'offline' : 'error');
  } finally { $('#loadingNote').hidden = true; }
  render();
  updateComposer();
  startPolling();
  refreshUsage();
}
async function boot() {
  wireUI();
  restoreDraft();
  const cfg = readConfig();
  if (!cfg) { showAuth('setup'); return; }
  S.url = cfg.url.replace(/\/+$/, '');
  S.key = cfg.key;
  S.session = readSession();
  if (!S.session) { showAuth('login'); return; }
  startApp();
}

/* ---------- 보내기 ---------- */
function enterSends() { return window.matchMedia('(hover: hover) and (pointer: fine)').matches; }
function updateComposer() {
  const usable = !!S.session && S.loaded;
  btnAttach.disabled = !usable;
  btnSend.disabled = !usable || (!input.value.trim() && !S.staged.length);
}
function autosize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight + 2, 148) + 'px';
}
let draftTimer = 0;
function restoreDraft() { const d = load(DRAFT_KEY); if (d) { input.value = d; autosize(); } }
function saveDraftSoon() { clearTimeout(draftTimer); draftTimer = setTimeout(() => store(DRAFT_KEY, input.value || null), 400); }
function clearDraft() { clearTimeout(draftTimer); store(DRAFT_KEY, null); }

function send() {
  if (!S.session || !S.loaded) return;
  const text = input.value.replace(/^\s*\n/, '').replace(/\s+$/, '');
  if (!text.trim() && !S.staged.length) return;
  let longFile = null;
  if (text.trim() && text.length > MAX_TEXT) longFile = new File([text], '긴 메모 ' + stamp() + '.txt', { type: 'text/plain' });
  const staged = S.staged.splice(0);
  input.value = '';
  autosize();
  clearDraft();
  renderTray();
  updateComposer();
  let t = Date.now();
  if (longFile) { queueFile(longFile, t++); toast('글이 길어서 텍스트 파일로 보관해요'); }
  else if (text.trim()) queueText(text, t++);
  for (const s of staged) { queueFile(s.file, t++); if (s.url) URL.revokeObjectURL(s.url); }
  if (S.searchRows) closeSearch();
  S.stick = true;
  render();
  runUploads();
}
function queueText(text, t) {
  const job = { id: uuid(), t, kind: 'text', text, status: 'sending' };
  S.pending.set(job.id, job);
  sendTextJob(job);
}
async function sendTextJob(job) {
  job.status = 'sending';
  render();
  try {
    const row = await insertRow({ id: job.id, sent_at: new Date(job.t).toISOString(), body: job.text });
    applyRows([row]);
    S.pending.delete(job.id);
  } catch (e) {
    if (e && e.code === 'signed_out') { showLogin('로그인이 풀렸어요. 다시 로그인해 주세요.'); return; }
    job.status = 'failed';
    job.error = errText(e);
    toast(job.error);
  }
  render();
}
function queueFile(file, t) {
  const job = { id: uuid(), t, kind: 'file', file, name: file.name || '파일', size: file.size, type: file.type || '', status: 'queued', progress: 0, res: {} };
  S.pending.set(job.id, job);
}
let uploading = false;
async function runUploads() {
  if (uploading) return;
  uploading = true;
  try {
    for (;;) {
      const job = [...S.pending.values()].filter((j) => j.kind === 'file' && j.status === 'queued').sort(byTime)[0];
      if (!job) break;
      await processJob(job);
    }
  } finally { uploading = false; }
}
function loadImg(url) {
  return new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = url; });
}
async function makeThumb(file) {
  let src = null, w = 0, h = 0, release = null;
  try {
    if (window.createImageBitmap) { const bmp = await createImageBitmap(file); src = bmp; w = bmp.width; h = bmp.height; release = () => bmp.close && bmp.close(); }
  } catch (_) { src = null; }
  if (!src) {
    let url = '';
    try { url = URL.createObjectURL(file); const img = await loadImg(url); src = img; w = img.naturalWidth; h = img.naturalHeight; release = () => URL.revokeObjectURL(url); }
    catch (_) { if (url) URL.revokeObjectURL(url); return null; }

  const list = entries();

  const today = dayKey(Date.now());
  const want = [], live = new Set();

  for (const it of items) {
    const sig = it.day ? 'd|' + today : sigOf(it.e);
    let rec = nodes.get(it.key);
    if (!rec || rec.sig !== sig) {
      const node = it.day ? dayNode(it.day) : rowNode(it.e);

  const body = $('#drawerBody');
  const top = body.scrollTop;
  body.textContent = '';
  const msgs = S.sorted.slice().reverse();
  let count = 0, month = '', box = null;
  if (S.tab === 'media') {
    for (const m of msgs) {
      const f = m.file;
      if (!f || !isMediaShown(f)) continue;
      count++;
      if (monthKey(m.t) !== month) { month = monthKey(m.t); monthHead(body, m.t); box = el('div', 'grid'); body.append(box); }
      const tile = button('tile', null, () => openViewer(f, m.id));
      tile.setAttribute('aria-label', f.n);
      if (kindOf(f) === 'video') {
        const v = el('video');
        v.muted = true; v.preload = 'metadata'; v.playsInline = true; v.dataset.path = f.p;
        const p = el('span', 'play');
        p.innerHTML = ICON.play;
        tile.append(v, p);
      } else tile.append(mediaImg(thumbPath(f), '', () => {}));
      box.append(tile);
    }
    if (!count) body.append(el('p', 'drawer-empty', '보관한 사진·동영상이 없어요.'));
  } else if (S.tab === 'files') {
    for (const m of msgs) {
      const f = m.file;
      if (!f || isMediaShown(f)) continue;
      count++;
      if (monthKey(m.t) !== month) { month = monthKey(m.t); monthHead(body, m.t); box = el('div', 'flist'); body.append(box); }
      const row = el('div', 'frow');
      const info = el('div', 'finfo');
      info.append(el('div', 'fname', f.n), el('div', 'fmeta', fmtDate.format(m.t) + ' · ' + fmtSize(f.s)));
      row.append(badge(f.n), info, fileButtons(f));
      box.append(row);
    }
    if (!count) body.append(el('p', 'drawer-empty', '보관한 파일이 없어요.'));
  } else {
    for (const m of msgs) {
      if (!m.text) continue;
      for (const tk of tokenize(m.text)) {
        if (!tk.href) continue;
        count++;
        if (monthKey(m.t) !== month) { month = monthKey(m.t); monthHead(body, m.t); box = el('div', 'flist'); body.append(box); }
        const row = el('div', 'lrow');
        const a = el('a', null, tk.v);
        a.href = tk.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
        row.append(a, el('span', null, fmtDate.format(m.t)));
        box.append(row);
      }
    }
    if (!count) body.append(el('p', 'drawer-empty', '보관한 링크가 없어요.'));
  }
  if (S.hasMore) body.append(el('p', 'drawer-note', '최근 대화에서 모았어요. 대화 화면에서 이전 메시지를 더 불러오면 여기에도 보여요.'));
  hydrateMedia(body);
  body.scrollTop = top;
}

/* ---------- 메뉴 · 저장공간 ---------- */
async function refreshUsage() {
  try {
    const r = await api('/rest/v1/rpc/storage_used', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const n = Number(await r.json());
    if (Number.isFinite(n)) S.usage = n;
  } catch (_) { /* 표시만 생략 */ }
  renderSub();
  if (!$('#menuWrap').hidden) renderMenuStorage();
}
let usageTimer = 0;
function refreshUsageSoon() { clearTimeout(usageTimer); usageTimer = setTimeout(refreshUsage, 1200); }
function renderMenuStorage() {
  const box = $('#menuStorage');
  box.textContent = '';
  box.append(el('div', 'ms-label', '저장공간'));
  const u = S.usage;
  box.append(el('div', 'ms-big', u == null ? '확인 중…' : fmtSize(u) + ' / ' + fmtSize(STORAGE_LIMIT)));
  if (u != null) {
    const bar = el('div', 'ms-bar'), fill = el('span');
    fill.style.width = Math.min(100, (u / STORAGE_LIMIT) * 100).toFixed(1) + '%';
    bar.append(fill);
    box.append(bar);
  }
  box.append(el('div', 'ms-note', (S.session && S.session.email ? S.session.email + ' · ' : '') + '파일 1개당 50MB까지'));
}
function openMenu() { $('#menuWrap').hidden = false; renderMenuStorage(); refreshUsage(); $('#miHelp').focus(); }
function closeMenu() { $('#menuWrap').hidden = true; }
function showHelp() {
  closeMenu();
  const ul = el('ul');
  [
    'PC에서는 Enter로 보내고 Shift+Enter로 줄을 바꿔요.',
    '파일은 + 버튼으로 고르거나, PC에서는 끌어다 놓거나 캡처를 Ctrl+V로 붙여넣어요.',
    '파일은 원본 그대로 보관해요. 1개당 50MB까지예요.',
    '메시지를 누르면 복사·저장·삭제 버튼이 나오고, 사진·동영상은 눌러서 크게 볼 수 있어요.',
    '다른 기기에서 보낸 메시지는 몇 초 안에 이 화면에도 나타나요.',
    '7일 넘게 어느 기기에서도 열지 않으면 Supabase 프로젝트가 일시정지돼요. 그때는 Supabase 화면에서 다시 켜 주세요.'
  ].forEach((s) => ul.append(el('li', null, s)));
  dialog({ title: '사용법', body: ul, ok: '닫기', okOnly: true });
}
async function cleanupOrphans() {
  closeMenu();
  let names;
  try {
    const r = await api('/rest/v1/rpc/orphan_files', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    names = (await r.json()).filter(safePath);
  } catch (e) { toast(errText(e)); return; }
  if (!names.length) { toast('정리할 파일이 없어요'); return; }
  const ok = await dialog({
    title: '안 쓰는 파일을 정리할까요?',
    body: '메시지와 연결되지 않은 파일 ' + names.length + '개를 지워요. 올리다 멈춘 파일 등이 여기에 해당해요.',
    ok: '정리하기'
  });
  if (!ok) return;
  try { await removeObjects(names); toast(names.length + '개를 정리했어요'); } catch (e) { toast(errText(e)); }
  refreshUsage();
}

/* ---------- 이벤트 ---------- */
function closeOverlays() { closeViewer(); closeText(); closeDrawer(); closeMenu(); $('#dialog').hidden = true; }
function wireUI() {
  $('#btnSearch').innerHTML = ICON.search;
  $('#btnDrawer').innerHTML = ICON.grid;
  $('#btnMenu').innerHTML = ICON.dots;
  btnAttach.innerHTML = ICON.plus;
  btnSend.innerHTML = ICON.send;
  $('#drawerClose').innerHTML = ICON.close;
  $('#viewerClose').innerHTML = ICON.close;
  $('#tvClose').innerHTML = ICON.close;
  $('#jumpIcon').innerHTML = ICON.down;

  $('#authForm').addEventListener('submit', onAuthSubmit);
  $('#form').addEventListener('submit', (e) => { e.preventDefault(); send(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && enterSends()) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', () => { autosize(); saveDraftSoon(); updateComposer(); });
  btnAttach.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { stageFiles(fileInput.files); fileInput.value = ''; });
  document.addEventListener('paste', (e) => {
    if ($('#app').hidden || (e.target && e.target.id === 'searchInput')) return;
    const cd = e.clipboardData;
    if (!cd) return;
    const files = Array.from(cd.files || []);
    if (!files.length) return;
    if (Array.from(cd.types || []).includes('text/plain') && cd.getData('text/plain')) return;
    e.preventDefault();
    stageFiles(files.map(renamePasted));
  });

  const drop = $('#drop');
  let depth = 0;
  const hasFiles = (e) => !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files'));
  window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); depth++; if (S.loaded && !$('#app').hidden) drop.hidden = false; });
  window.addEventListener('dragover', (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  window.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) drop.hidden = true; });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth = 0;
    drop.hidden = true;
    stageFiles(e.dataTransfer.files);
  });

  scroller.addEventListener('scroll', () => { S.atBottom = nearBottom(); if (S.atBottom) jumpBtn.hidden = true; }, { passive: true });
  window.addEventListener('resize', () => { if (S.atBottom) scrollToBottom(false); });
  scroller.addEventListener('click', (ev) => {
    if (ev.target.closest('a, button, video, input, textarea, .actions')) return;
    if (window.getSelection && String(window.getSelection())) return;
    const hit = ev.target.closest('.stack, .meta');
    const row = hit && hit.closest('.row');
    const id = row && row.dataset.id;
    const prev = S.selected;
    S.selected = id && msgById(id) && prev !== id ? id : null;
    if (prev !== S.selected) applySelection(true);
  });
  jumpBtn.addEventListener('click', () => scrollToBottom(true));
  $('#btnMore').addEventListener('click', loadOlder);
  $('#bannerBtn').addEventListener('click', () => { if (!S.loaded) startApp(); else poll(); });

  $('#btnSearch').addEventListener('click', () => {
    const sb = $('#searchbar');
    if (sb.hidden) { sb.hidden = false; $('#searchInput').focus(); } else closeSearch();
  });
  $('#searchInput').addEventListener('input', runSearch);
  $('#btnSearchClose').addEventListener('click', closeSearch);

  $('#btnDrawer').addEventListener('click', openDrawer);
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#drawer').addEventListener('click', (e) => { if (e.target.id === 'drawer') closeDrawer(); });
  for (const b of document.querySelectorAll('.tab')) b.addEventListener('click', () => { S.tab = b.dataset.tab; $('#drawerBody').scrollTop = 0; renderDrawer(); });

  $('#btnMenu').addEventListener('click', () => { if ($('#menuWrap').hidden) openMenu(); else closeMenu(); });
  $('#menuBackdrop').addEventListener('click', closeMenu);
  $('#miHelp').addEventListener('click', showHelp);
  $('#miClean').addEventListener('click', cleanupOrphans);
  $('#miLogout').addEventListener('click', signOut);

  $('#viewerClose').addEventListener('click', closeViewer);
  $('#viewerBody').addEventListener('click', (e) => { if (e.target.id === 'viewerBody') closeViewer(); });
  $('#tvClose').addEventListener('click', closeText);
  $('#textView').addEventListener('click', (e) => { if (e.target.id === 'textView') closeText(); });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('#viewer').hidden) closeViewer();
    else if (!$('#textView').hidden) closeText();
    else if (!$('#drawer').hidden) closeDrawer();
    else if (!$('#menuWrap').hidden) closeMenu();
    else if (!$('#searchbar').hidden) closeSearch();
    else if (S.selected) { S.selected = null; applySelection(false); }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  window.addEventListener('focus', () => poll());
  window.addEventListener('online', () => poll());
  window.addEventListener('storage', (e) => {
    if (e.key !== SESSION_KEY) return;
    const s = readSession();
    if (s) S.session = s;
    else if (S.session && !$('#app').hidden) showLogin('다른 창에서 로그아웃했어요.');
  });
  updateComposer();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
